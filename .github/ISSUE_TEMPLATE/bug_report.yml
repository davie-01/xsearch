name: 问题反馈
description: 搜索结果不对、崩溃、索引异常或界面问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿附上含个人信息的真实文件、路径或索引数据。能用合成文件重现时，附上合成样本即可。
  - type: input
    id: version
    attributes:
      label: XSearch 版本
      description: 设置 → 通用 → 软件更新中的“当前版本”
      placeholder: 例如 0.2.0 (2)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本与机型
      placeholder: 例如 macOS 26.1，MacBook Air M2
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 涉及的功能
      options:
        - 名称搜索 / 应用启动
        - 内容搜索
        - 完整窗口 / 阅读窗口
        - 压缩包内容
        - 索引范围与诊断
        - 设置、快捷键、首次引导
        - 自动更新
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 包括输入的查询原文、匹配方式（宽松 / 区分大小写 / 严格原文）和相关文件类型
      placeholder: |
        1. 在启动器输入 …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（可选）
      description: 设置 → 诊断中的路径与索引状态、崩溃报告摘要等，请先去除个人信息
