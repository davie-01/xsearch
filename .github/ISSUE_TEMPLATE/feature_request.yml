name: 功能建议
description: 新的文件格式、查询语法或交互改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在怎么做、哪里不方便
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
