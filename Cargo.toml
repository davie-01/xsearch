[workspace]
members = ["rust/xs-core", "rust/xs-index", "rust/xs-parsers", "rust/xs-ffi", "cli/xs"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
version = "0.0.1"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = { version = "=0.27.0", features = ["zstd-compression"] }
unicode-normalization = "=0.1.25"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
zip = { version = "4.6", default-features = false, features = ["deflate", "bzip2"] }
roxmltree = "0.20"
encoding_rs = "0.8"
regex = "1.13"
regex-syntax = "0.8"

