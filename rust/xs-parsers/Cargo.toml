[package]
name = "xs-parsers"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "XSearch text extraction in Rust: plain text / code (encoding detection) and DOCX (ARCHITECTURE §10)."

[dependencies]
anyhow.workspace = true
calamine = { version = "=0.30.1", default-features = false }
tar = "=0.4.46"
flate2 = "1"
sevenz-rust2 = { version = "=0.24.1", features = ["deflate"] }
unrar = "=0.5.8"
cfb = "=0.15.0"
mail-parser = { version = "=0.11.2", features = ["full_encoding"] }
encoding_rs.workspace = true
roxmltree.workspace = true
serde.workspace = true
zip.workspace = true
xs-index = { path = "../xs-index" }

[dev-dependencies]
tempfile.workspace = true
