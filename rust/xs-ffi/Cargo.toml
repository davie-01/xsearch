[package]
name = "xs-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Swift bindings (UniFFI) for the XSearch content index; the app's single Rust static library."

[lib]
# cdylib: the app's one shared Rust library (Contents/Frameworks/libxs_ffi.dylib), loaded by
# XSearch, xs-extract and IndexService alike; uniffi-bindgen reads its metadata too.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
uniffi = { version = "=0.29.5", features = ["cli"] }
xs-core = { path = "../xs-core" }
xs-index = { path = "../xs-index" }
xs-parsers = { path = "../xs-parsers" }
